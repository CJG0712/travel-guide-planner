name: Validate Skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: python -m pip install --no-cache-dir PyYAML

      - name: Validate skill package and references
        run: python scripts/validate_skill.py

      - name: Check trailing whitespace and conflict markers
        run: git diff --check
